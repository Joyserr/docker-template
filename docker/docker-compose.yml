# Docker Development Environment — Unified Runtime Configuration
# All variables are loaded from docker/config/.env
#
# GPU support:
#   - x86 desktop:  needs nvidia-container-toolkit; runtime + deploy both work
#   - Jetson (Orin): uses nvidia-container-runtime built into JetPack;
#                    only 'runtime: nvidia' is reliable, deploy.devices may be ignored

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_NAME: ${USER_NAME:-user}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${IMAGE_NAME:-dev}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dev}
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ${WORKSPACE_DIR:-..}:/home/${USER_NAME:-user}/${CONTAINER_WORKSPACE:-workspace}
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - config/env.custom
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-${USER_NAME:-user}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
    working_dir: /home/${USER_NAME:-user}/${CONTAINER_WORKSPACE:-workspace}
    shm_size: '2g'
    ipc: host
